<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0B">
<title>Estudos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0B;--cd:#161717;--cd2:#1E1F1F;--in:#0F1010;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.15);--tx:#ECECEC;--mu:#8D9291;--ac:#4F8A76;--ac2:#3B6657;--ok:#1FB15F;--rd:#FF6961;--mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--cond:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(50% 32% at 50% 0%,rgba(46,98,82,.26),transparent 72%),radial-gradient(40% 30% at 100% 60%,rgba(46,98,82,.07),transparent 70%)}
a{color:inherit;text-decoration:none}
main{max-width:1120px;margin:0 auto;padding:22px 0 0}
h1{margin:0}
h2{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:28px 0 10px 4px}
h3{margin:0}

/* barra de topo */
#nv{display:flex;align-items:center;gap:8px;max-width:1120px;margin:0 auto;padding:12px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5}
.brand{font:500 14px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0 6px 0 4px;margin-right:auto}
.pills{display:flex;gap:8px;margin-right:10px}
.pills a{display:inline-flex;align-items:center;font:600 11.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:12px 15px;border-radius:9px;background:var(--cd2);border:1px solid transparent}
.pills a:hover{background:#262727}
.pills a.on{background:#2A2B2B;border-color:var(--bd2)}
.pills a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px}
#fab{min-height:0;padding:12px 18px;border-radius:9px;background:var(--ac2);border:1px solid rgba(255,255,255,.1);color:#E9F6F0;font:600 11.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
#fab:hover{background:#447563}

/* blocos */
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px;display:block}
a.card{transition:border-color .15s,background .15s}
a.card:hover{border-color:var(--bd2);background:var(--cd2)}
.hd{padding:24px}
.sub{color:var(--mu);font-size:14px;margin:8px 0 0}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gr.fit{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pn{margin-top:22px;padding:12px;border:1px solid var(--bd2);border-radius:22px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:16px 18px;background:var(--cd);border:1px solid var(--bd);border-radius:12px}
.ph h2{margin:0;font:600 14px var(--mono);letter-spacing:.05em;color:#fff}
.lg{max-width:460px;margin:8vh auto 0}

/* título em 3 níveis (como no modelo) */
.hl{font-family:var(--cond);text-transform:uppercase;line-height:1.12;letter-spacing:-.005em}
.hl b{display:block;font-weight:600;font-size:clamp(30px,4.2vw,42px);color:var(--tx)}
.hl>span{display:block;font-weight:600;font-size:clamp(22px,3vw,30px);color:#A9ADAC;margin-top:2px}
.hl em{display:block;font-style:normal;font-weight:500;font-size:clamp(17px,2.2vw,22px);color:#6F7473;margin-top:2px}

/* hoje */
.hg{display:grid;gap:14px;grid-template-columns:1fr}
.hero{padding:26px;display:flex;flex-direction:column}
.top{align-items:flex-start}
.clk{font:500 clamp(44px,8vw,64px)/1.1 var(--mono);letter-spacing:-.03em;margin:22px 0 16px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.strip{margin-top:22px;padding:15px 16px;background:var(--in);border:1px solid var(--bd);border-radius:12px;font:500 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.strip .row{display:flex;flex-wrap:wrap;gap:6px 0}
.strip span+span::before{content:"•";margin:0 14px;opacity:.6}
.strip b{color:var(--tx);font-weight:600}
.strip .bar{margin-top:14px}
.vis{display:flex;flex-direction:column;background:radial-gradient(90% 70% at 100% 0%,rgba(79,138,118,.18),transparent 70%),var(--cd)}
.k{font:600 14px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.vis .cht{flex:1;min-height:150px;margin-top:20px}
.vis .go{margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--bd2);border-radius:999px;background:var(--in);font:500 12px var(--mono);color:var(--mu);white-space:nowrap}
.pill.sm{padding:5px 12px}
.led{width:8px;height:8px;border-radius:50%;background:#555}
.led.on{background:var(--ok);box-shadow:0 0 0 3px rgba(31,177,95,.2)}
.go{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.ci{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd2);background:var(--in);font-size:14px}
.pc h3{font:600 14px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* formulários e botões */
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd2);border-radius:10px;padding:11px 14px;min-height:46px}
button{cursor:pointer;font:600 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--cd2);transition:background .15s}
button:hover{background:#292A2A}
button.p{background:var(--ac2);color:#EAF6F0;border-color:rgba(255,255,255,.1)}button.p:hover{background:#447563}
button.d,.d{color:var(--rd)}
button.g{background:none;border:0;color:var(--mu);min-height:36px;padding:6px 10px}button.g:hover{background:none;color:var(--tx)}
button.g.d,button.g.d:hover{color:var(--rd)}
input,select,textarea{width:100%}input[type=color]{padding:3px;width:54px}input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
::placeholder{color:var(--mu)}
option{background:#1E1F1F}
:focus-visible{outline:2px solid #6FB39B;outline-offset:2px}

/* dados */
.stat{font:500 30px/1.15 var(--mono);letter-spacing:-.03em}.big{font:500 40px/1.1 var(--mono);letter-spacing:-.03em}
.lbl{color:var(--mu);font-size:13px}
.bar{height:6px;background:rgba(255,255,255,.09);border-radius:3px;margin-top:12px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}.dot.lg{width:14px;height:14px;margin-right:12px}
.it{padding:13px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.tag{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.08);white-space:nowrap}
.hot{background:rgba(255,105,97,.16);color:#FF9D97}.warm{background:rgba(255,179,64,.16);color:#FFC266}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.ed{display:grid;gap:8px;padding-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin:14px 0}
.tabs a{padding:11px 16px;border-radius:9px;background:var(--cd2);font:600 11.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.tabs a.on{background:var(--ac2);color:#fff}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.ok{text-decoration:line-through;color:var(--mu)}
.cht{display:flex;gap:5px;height:110px}
.cht>div{flex:1;display:flex;flex-direction:column;gap:5px;text-align:center;font:400 10px var(--mono);color:var(--mu)}
.bw{position:relative;flex:1}.bw i{position:absolute;left:0;right:0;bottom:0;background:var(--ac);border-radius:4px 4px 2px 2px;min-height:2px}
.cht u{text-decoration:none}
.back{margin-bottom:0}

/* timer flutuante e folha de registro */
#mini{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,380px);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;display:none;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:14px;background:#14231E;border:1px solid rgba(79,138,118,.5);box-shadow:0 12px 32px rgba(0,0,0,.45);font:600 12px var(--mono);letter-spacing:.04em;text-transform:uppercase}
#mini.on{display:flex}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:9;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none;background:#131414;border-top:1px solid var(--bd2)}
.sh.on{display:block;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.sh>div{max-width:560px;margin:0 auto;display:grid;gap:8px}
.sh .tabs{margin:0 0 6px}
#msg{color:var(--rd);font-size:14px;margin:8px}

@media(min-width:860px){.hg{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media(max-width:700px){
  #nv{flex-wrap:wrap}
  .pills{order:3;width:100%;margin:2px 0 0}
  .pills a{flex:1;justify-content:center}
  .hero{padding:20px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header id="nv" style="display:none"><span class="brand">Estudos</span><div class="pills"><a href="#hoje" data-t="hoje">Hoje</a><a href="#materias" data-t="materias">Matérias</a><a href="#ajustes" data-t="ajustes">Ajustes</a></div><button id="fab" aria-label="Adicionar registro" onclick="Q(true)">+ Registrar</button></header>
<main id="m"></main>
<a id="mini" href="#hoje"><span id="mn"></span><span id="mt"></span></a>
<div class="sh" id="sh"></div>
<script>
const sb=supabase.createClient('https://imisnquvmrmxufhvhfrd.supabase.co','sb_publishable_fiqvZpb6S2yV1G5KpnxxrQ_P4ieZDyO');
const T=['materias','estudos','eventos','notas','regras','listas','plano','sessao'];
const S=Object.fromEntries(T.map(t=>[t,[]]));
const $=s=>document.querySelector(s);
let user=null,msg='',mt='horas',qt='estudo',sent=false,qopen=false,loaded=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>d.toLocaleDateString('sv'),dm=d=>d.slice(8)+'/'+d.slice(5,7);
const fh=h=>{let t=Math.round(h*60);return Math.floor(t/60)+'h'+String(t%60).padStart(2,'0')};
const left=d=>Math.round((new Date(d+'T00:00')-new Date(ymd()+'T00:00'))/864e5);
const ws=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const mat=n=>S.materias.find(x=>x.nome===n),cor=n=>mat(n)?.cor||'#8A9BB0';
const sum=f=>S.estudos.filter(f).reduce((a,r)=>a+Number(r.horas),0);
const hs=m=>sum(r=>r.materia===m&&r.data>=ws());
const opts=(sel)=>S.materias.map(x=>`<option${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`).join('');
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p))}%;background:${c}"></i></div>`;

/* ---------- dados ---------- */
async function load(t){const{data,error}=await sb.from(t).select('*');if(error)msg=error.message;else S[t]=data}
async function W(p,...ts){const r=await p;msg=r.error?r.error.message:'';await Promise.all(ts.map(load));render(true);return !r.error}
async function boot(){await Promise.all(T.map(load));loaded=true;render(true);
  sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},p=>load(p.table).then(()=>render())).subscribe()}
sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null;if(u&&!user){user=u;boot()}else if(!u){user=null;loaded=false;render(true)}});

/* ---------- cronômetro ---------- */
const ses=()=>S.sessao[0]||null;
const el=()=>{const s=ses();return s?Number(s.acumulado_ms)+(s.rodando?Date.now()-new Date(s.inicio):0):0};
const clock=ms=>{const t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(n=>String(n).padStart(2,'0')).join(':')};
const iniciar=()=>{const m=$('#cm').value;if(m)W(sb.from('sessao').upsert({id:1,materia:m,inicio:new Date().toISOString(),acumulado_ms:0,rodando:true}),'sessao')};
const pausar=()=>{const s=ses();W(s.rodando?sb.from('sessao').update({acumulado_ms:Math.round(el()),rodando:false}).eq('id',1):sb.from('sessao').update({inicio:new Date().toISOString(),rodando:true}).eq('id',1),'sessao')};
async function encerrar(){const s=ses(),h=el()/36e5;if(h>=1/120)await sb.from('estudos').insert({materia:s.materia,horas:h,data:ymd()});W(sb.from('sessao').delete().eq('id',1),'sessao','estudos')}
const descartar=()=>{if(confirm('Descartar esta sessão sem salvar?'))W(sb.from('sessao').delete().eq('id',1),'sessao')};
setInterval(()=>{if(!ses())return;const c=clock(el());if($('#clk'))$('#clk').textContent=c;$('#mt').textContent=c},1000);

/* ---------- notas ---------- */
const leaves=c=>c.subcomponentes?c.subcomponentes.flatMap(leaves):[c.nome];
const avg=l=>l.reduce((a,b)=>a+b)/l.length;
function prov(c,n){if(c.subcomponentes){let w=0,p=0;for(const x of c.subcomponentes){const v=prov(x,n);if(v!=null){w+=x.peso;p+=v*x.peso}}return w?p/w:null}const l=n[c.nome];return l&&l.length?avg(l):null}
function parc(c,n,e){if(c.subcomponentes){const t=c.subcomponentes.reduce((a,x)=>a+x.peso,0);let p=0,o=0;for(const x of c.subcomponentes){const[a,b]=parc(x,n,e*x.peso/t);p+=a;o+=b}return[p,o]}const l=n[c.nome];return l&&l.length?[avg(l)/10*e,0]:[0,e]}
function info(m){const cfg=S.regras.find(r=>r.materia===m)?.config;if(!cfg)return null;const n={};S.notas.filter(r=>r.materia===m).forEach(r=>(n[r.componente]??=[]).push(Number(r.valor)));
  const root={subcomponentes:cfg.componentes};let md=prov(root,n);if(md!=null&&cfg.arredondar_meio_ponto)md=Math.floor(md*2+.5)/2;
  const[p,o]=parc(root,n,10),meta=cfg.arredondar_meio_ponto?5.75:6;return{md,br:p,meta,cfg,open:o>1e-9,need:o>1e-9?(meta-p)*10/o:null}}
const comps=m=>{const c=S.regras.find(r=>r.materia===m)?.config;return c?leaves({subcomponentes:c.componentes}):[]};

/* ---------- foco recomendado ---------- */
function foco(){const hoje=ymd();return S.materias.map(x=>{const m=x.nome,pv=S.eventos.filter(e=>e.materia===m&&e.tipo==='Prova'&&e.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data))[0],
  d=pv?left(pv.data):null,u=d==null?0:1/(1+d/7),f=info(m),r=f&&f.md!=null?Math.max(0,(6-f.md)/6):0,h=hs(m),df=x.meta_horas?Math.max(0,1-h/x.meta_horas):.3;
  return{m,d,md:f?.md,br:f?.br,h,score:.5*u+.3*r+.2*df}}).sort((a,b)=>b.score-a.score)}

/* ---------- escrita ---------- */
const val=id=>$('#'+id)?.value?.trim()??'';
async function addEstudo(p='q'){const m=val(p+'m'),h=+val(p+'h')||0,mi=+val(p+'i')||0;if(!m||h+mi<=0){msg='Informe matéria e tempo.';return render(true)}
  if(await W(sb.from('estudos').insert({materia:m,horas:h+mi/60,data:val(p+'d')||ymd()}),'estudos'))Q(false)}
async function addNota(p='q'){const v=parseFloat(val(p+'v').replace(',','.'));if(isNaN(v)||v<0||v>10){msg='Nota entre 0 e 10.';return render(true)}
  if(await W(sb.from('notas').insert({materia:val(p+'m'),componente:val(p+'c'),valor:v,data:val(p+'d')||ymd()}),'notas'))Q(false)}
async function addPrazo(p='q'){if(!val(p+'x')||!val(p+'d')){msg='Informe descrição e data.';return render(true)}
  if(await W(sb.from('eventos').insert({materia:val(p+'m'),tipo:val(p+'t'),descricao:val(p+'x'),data:val(p+'d')}),'eventos'))Q(false)}
const del=(t,id)=>W(sb.from(t).delete().eq('id',id),t);
const movPrazo=id=>{const v=$('#d'+id).value;if(v)W(sb.from('eventos').update({data:v}).eq('id',id),'eventos')};
const stepL=(id,d)=>{const r=S.listas.find(x=>x.id===id);W(sb.from('listas').update({feitas:Math.max(0,Math.min(r.total,r.feitas+d))}).eq('id',id),'listas')};
const addL=m=>{const n=val('ln'),t=+val('lt');if(!n||t<1){msg='Nome e nº de questões.';return render(true)}W(sb.from('listas').insert({materia:m,nome:n,total:t}),'listas')};
const tgl=(id,ok)=>W(sb.from('plano').update({ok}).eq('id',id),'plano');
const addP=m=>{const l=val('pt').split('\n').map(x=>x.trim()).filter(Boolean);if(!l.length)return;const o=S.plano.filter(x=>x.materia===m).length;W(sb.from('plano').insert(l.map((t,i)=>({materia:m,topico:t,ordem:o+i}))),'plano')};
async function saveCfg(){for(const x of S.materias){const c=$('#c_'+x.nome)?.value,v=parseFloat(($('#mh_'+x.nome)?.value||'').replace(',','.'));
  await sb.from('materias').update({cor:c,meta_horas:v>0?v:null}).eq('nome',x.nome)}W(Promise.resolve({}),'materias')}
const addMat=()=>{const n=val('nn');if(n)W(sb.from('materias').insert({nome:n,cor:$('#nc').value}),'materias')};
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='estudos-backup-'+ymd()+'.json';a.click()}

/* ---------- adicionar rápido ---------- */
function Q(open){qopen=open;$('#sh').classList.toggle('on',open);if(!open){$('#sh').innerHTML='';return}drawQ()}
function setQ(t){qt=t;drawQ()}
function fMat(p,m){return `<select id="${p}m"${qt==='nota'?` onchange="$('#${p}c').innerHTML=comps(this.value).map(c=>'<option>'+c+'</option>').join('')"`:''}>${opts(m)}</select>`}
function drawQ(){const m0=S.materias[0]?.nome;
  const f=qt==='estudo'?`${fMat('q')}<div class="g2"><input id="qh" type="number" min="0" placeholder="Horas"><input id="qi" type="number" min="0" max="59" step="5" placeholder="Minutos"></div><input id="qd" type="date" value="${ymd()}"><button class="p" onclick="addEstudo()">Registrar</button>`
   :qt==='nota'?`${fMat('q')}<select id="qc">${comps(m0).map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="g2"><input id="qv" inputmode="decimal" placeholder="Nota (0 a 10)"><input id="qd" type="date" value="${ymd()}"></div><button class="p" onclick="addNota()">Lançar</button>`
   :`${fMat('q')}<select id="qt">${['Prova','Entrega','Apresentação','Outro'].map(t=>`<option>${t}</option>`).join('')}</select><input id="qx" placeholder="Descrição"><input id="qd" type="date" value="${ymd()}"><button class="p" onclick="addPrazo()">Adicionar</button>`;
  $('#sh').innerHTML=`<div><div class="tabs">${['estudo','nota','prazo'].map(t=>`<a href="javascript:setQ('${t}')" class="${t===qt?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>${msg?`<div id="msg">${esc(msg)}</div>`:''}${f}<button class="g" onclick="Q(false)">Fechar</button></div>`}

/* ---------- componentes de tela ---------- */
function evRow(r){const n=left(r.data),t=n===0?'Hoje':n===1?'Amanhã':n<0?dm(r.data):n+' dias',c=n<=1?'hot':n<=7?'warm':'';
  return `<details class="it"><summary class="sp"><span><span class="dot" style="background:${cor(r.materia)}"></span><b>${esc(r.materia)}</b><span class="lbl"> · ${esc(r.tipo)} · ${esc(r.descricao)} · ${dm(r.data)}</span></span><span class="tag ${c}">${t}</span></summary>
  <div class="ed"><input type="date" id="d${r.id}" value="${r.data}"><div class="g2"><button class="p" onclick="movPrazo('${r.id}')">Remarcar</button><button class="d" onclick="del('eventos','${r.id}')">Excluir</button></div></div></details>`}
const futuros=m=>S.eventos.filter(e=>e.data>=ymd()&&(!m||e.materia===m)).sort((a,b)=>a.data.localeCompare(b.data));
function chart(f){const ds=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(ymd(d))}
  const v=ds.map(d=>sum(r=>r.data===d&&f(r))),mx=Math.max(...v,.1);
  return `<div class="cht">${ds.map((d,i)=>`<div><span class="bw"><i style="height:${v[i]/mx*100}%;${v[i]?'':'opacity:.25'}"></i></span><u>${+d.slice(8)}</u></div>`).join('')}</div><div class="lbl" style="margin-top:8px">Últimos 14 dias · ${fh(v.reduce((a,b)=>a+b,0))}</div>`}

/* ---------- telas ---------- */
const arrow='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const hlx=(a,b,c)=>`<h1 class="hl"><b>${a}</b><span>${b}</span><em>${c}</em></h1>`;
const head=(t,s)=>`<div class="card hd"><h1 class="hl"><b>${t}</b></h1>${s?`<p class="sub">${s}</p>`:''}</div>`;
const panel=(t,inner,extra='')=>`<section class="pn"><div class="ph"><h2>${t}</h2>${extra}</div>${inner}</section>`;
function vLogin(){return `<div class="lg">${head('Estudos','Entre com seu e-mail para receber o link de acesso')}<div class="card" style="display:grid;gap:8px;margin-top:12px">
  ${sent?'<div>Link enviado. Abra o e-mail neste aparelho e toque no link.</div>':`<input id="em" type="email" placeholder="seu@email.com" autocomplete="email"><button class="p" onclick="entrar()">Enviar link</button>`}${msg?`<div id="msg">${esc(msg)}</div>`:''}</div></div>`}
async function entrar(){const email=val('em');if(!email)return;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)msg=error.message;else{msg='';sent=true}render(true)}

function vHoje(){const s=ses(),h0=ymd(),ht=sum(r=>r.data===h0),hw=sum(r=>r.data>=ws()),metaT=S.materias.reduce((a,x)=>a+Number(x.meta_horas||0),0),fc=foco().filter(x=>x.score>.05).slice(0,3),mx=fc[0]?.score||1;
  const dt=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const hl=s?hlx('Estudando',`<span class="dot" style="background:${cor(s.materia)}"></span>${esc(s.materia)}`,s.rodando?'Cronômetro rodando':'Sessão pausada'):hlx('Hoje',esc(dt),'Nenhuma sessão ativa');
  const pill=`<span class="pill"><i class="led${s&&s.rodando?' on':''}"></i>${s?(s.rodando?'Em andamento':'Pausado'):'Parado'}</span>`;
  const ctl=s?`<div class="clk" id="clk">${clock(el())}</div><div class="g2"><button onclick="pausar()">${s.rodando?'Pausar':'Retomar'}</button><button class="p" onclick="encerrar()">Encerrar e salvar</button></div><button class="g d" style="width:100%;margin-top:6px" onclick="descartar()">Descartar sessão</button>`
   :`<div class="clk" style="color:var(--mu)">00:00:00</div><div class="row2"><select id="cm">${opts()}</select><button class="p" onclick="iniciar()">Iniciar</button></div>`;
  const strip=`<div class="strip"><div class="row"><span>Hoje <b>${fh(ht)}</b></span><span>Semana <b>${fh(hw)}</b></span>${metaT?`<span>Meta <b>${fh(metaT)}</b></span>`:''}</div>${metaT?bar(hw/metaT*100,'var(--ac)'):''}</div>`;
  const vis=`<div class="card vis"><div class="k">Atividade</div>${chart(()=>true)}<a class="go" href="#materias"><span class="ci">${arrow}</span>Ver matérias</a></div>`;
  const foc=fc.length?`<div class="gr fit">${fc.map(x=>`<a class="card pc" href="#m/${encodeURIComponent(x.m)}"><div class="sp"><h3><span class="dot" style="background:${cor(x.m)}"></span>${esc(x.m)}</h3><span class="go"><span class="ci">${arrow}</span>Abrir</span></div>
    <div class="lbl" style="margin-top:12px">${[x.d!=null?(x.d===0?'prova hoje':'prova em '+x.d+' d'):'',x.br!=null?'média bruta '+x.br.toFixed(2):'',fh(x.h)+' na semana'].filter(Boolean).join(' · ')}</div>${bar(x.score/mx*100,cor(x.m))}</a>`).join('')}</div>`
    :`<div class="card"><div class="lbl">Nada urgente agora.</div></div>`;
  const prz=`<div class="card">${futuros().slice(0,3).map(evRow).join('')||'<div class="lbl">Nenhum prazo futuro.</div>'}</div>`;
  return `<div class="hg"><div class="card hero"><div class="sp top">${hl}${pill}</div>${ctl}${strip}</div>${vis}</div>${panel('Foco recomendado',foc)}${panel('Próximos prazos',prz)}`}

function vMaterias(){const L=[...S.materias].sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  return head('Matérias','Toque para ver tudo de cada uma')+panel('Todas as matérias',`<div class="gr">${L.map(x=>{const f=info(x.nome),p=futuros(x.nome)[0],h=hs(x.nome);
  return `<a class="card pc" href="#m/${encodeURIComponent(x.nome)}"><div class="sp"><h3><span class="dot" style="background:${x.cor}"></span>${esc(x.nome)}</h3><span class="go"><span class="ci">${arrow}</span>Abrir</span></div>
  <div class="stat" style="margin-top:16px">${f?f.br.toFixed(2):'—'}</div><div class="lbl">média bruta</div>${bar(x.meta_horas?h/x.meta_horas*100:0,x.cor)}
  <div class="lbl" style="margin-top:8px">${fh(h)} na semana${p?` · ${esc(p.tipo)} em ${left(p.data)}d`:''}</div></a>`}).join('')}</div>`,`<span class="pill sm">${L.length}</span>`)}

function vMateria(m){const x=mat(m);if(!x)return '<div class="sub">Matéria não encontrada.</div><a href="#materias">← Matérias</a>';
  const tabs=['horas','notas','listas','plano','prazos'],c=x.cor;let b='';
  if(mt==='horas'){const rs=S.estudos.filter(r=>r.materia===m).sort((a,z)=>z.data.localeCompare(a.data)).slice(0,25),tot=sum(r=>r.materia===m);
    b=`<div class="g2"><div class="card"><div class="stat">${fh(hs(m))}</div><div class="lbl">na semana${x.meta_horas?' / '+fh(x.meta_horas):''}</div></div><div class="card"><div class="stat">${fh(tot)}</div><div class="lbl">total</div></div></div>
    <h2>Evolução</h2><div class="card">${chart(r=>r.materia===m)}</div><h2>Registros</h2><div class="card">${rs.map(r=>`<div class="it sp"><span>${dm(r.data)}</span><span><b>${fh(r.horas)}</b> <button class="g d" onclick="del('estudos','${r.id}')">Excluir</button></span></div>`).join('')||'<div class="lbl">Nenhum registro.</div>'}</div>`}
  if(mt==='notas'){const f=info(m),rs=S.notas.filter(r=>r.materia===m).sort((a,z)=>z.data.localeCompare(a.data));
    const st=!f||f.md==null?'Sem notas':f.open?(f.br>=f.meta?'Passando':'Ainda não passou'):f.md>=6?'Aprovado':f.md>=3?'Recuperação':'Em risco',nd=!f?'Sem regras cadastradas':!f.open?'Todas as notas lançadas':f.need<=0?'Aprovação já garantida':f.need>10?'Aprovação direta inviável':`Precisa de ${f.need.toFixed(2)} no restante`;
    b=`<div class="card"><div class="sp"><span class="big">${f?f.br.toFixed(2):'—'}</span><span class="tag">${st}</span></div><div class="lbl">média bruta · notas não lançadas valem 0</div><div class="lbl" style="margin-top:6px">${nd}</div>${f&&f.open&&f.md!=null?`<div class="lbl" style="margin-top:6px">Média só das notas lançadas: ${f.md.toFixed(2)}</div>`:''}${f?.cfg?.descricao?`<div class="lbl" style="margin-top:8px">${esc(f.cfg.descricao)}</div>`:''}</div>
    <h2>Lançamentos</h2><div class="card">${rs.map(r=>`<div class="it sp"><span>${esc(r.componente)} <span class="lbl">· ${dm(r.data)}</span></span><span><b>${Number(r.valor).toFixed(1)}</b> <button class="g d" onclick="del('notas','${r.id}')">Excluir</button></span></div>`).join('')||'<div class="lbl">Nenhuma nota.</div>'}</div>
    <h2>Lançar nota</h2><div class="card" style="display:grid;gap:8px"><input type="hidden" id="nm" value="${esc(m)}"><select id="nc">${comps(m).map(k=>`<option>${esc(k)}</option>`).join('')}</select><div class="g2"><input id="nv" inputmode="decimal" placeholder="Nota (0 a 10)"><input id="nd" type="date" value="${ymd()}"></div><button class="p" onclick="addNota('n')">Lançar</button></div>`}
  if(mt==='listas'){const ls=S.listas.filter(r=>r.materia===m);
    b=`<div class="card">${ls.map(r=>`<div class="it"><div class="sp"><b>${esc(r.nome)}</b><span class="lbl">${r.feitas}/${r.total}</span></div>${bar(r.feitas/r.total*100,c)}<div class="g2" style="margin-top:10px"><button onclick="stepL('${r.id}',-1)">−</button><button onclick="stepL('${r.id}',1)">+</button></div><button class="g d" onclick="del('listas','${r.id}')">Excluir lista</button></div>`).join('')||'<div class="lbl">Nenhuma lista.</div>'}
    <div class="g2" style="margin-top:12px"><input id="ln" placeholder="Nome (Lista 3)"><input id="lt" type="number" min="1" placeholder="Questões"></div><button class="p" style="width:100%;margin-top:8px" onclick="addL('${esc(m)}')">Adicionar lista</button></div>`}
  if(mt==='plano'){const ps=S.plano.filter(r=>r.materia===m).sort((a,z)=>a.ordem-z.ordem),f=ps.filter(r=>r.ok).length;
    b=`<div class="card">${ps.length?`<div class="sp"><b>Conteúdo estudado</b><span class="lbl">${f}/${ps.length}</span></div>${bar(f/ps.length*100,c)}`:''}${ps.map(r=>`<label class="chk"><input type="checkbox" ${r.ok?'checked':''} onchange="tgl('${r.id}',this.checked)"><span style="flex:1" class="${r.ok?'ok':''}">${esc(r.topico)}</span><button class="g d" onclick="event.preventDefault();del('plano','${r.id}')" aria-label="Remover">✕</button></label>`).join('')||'<div class="lbl" style="margin-top:6px">Cole os tópicos abaixo, um por linha.</div>'}
    <textarea id="pt" rows="4" placeholder="1. Carga e matéria&#10;2. Campo elétrico" style="margin-top:12px"></textarea><button class="p" style="width:100%;margin-top:8px" onclick="addP('${esc(m)}')">Adicionar tópicos</button></div>`}
  if(mt==='prazos'){b=`<div class="card">${S.eventos.filter(e=>e.materia===m).sort((a,z)=>a.data.localeCompare(z.data)).map(evRow).join('')||'<div class="lbl">Nenhum prazo.</div>'}</div>
    <h2>Novo prazo</h2><div class="card" style="display:grid;gap:8px"><input type="hidden" id="pm" value="${esc(m)}"><select id="pt2">${['Prova','Entrega','Apresentação','Outro'].map(t=>`<option>${t}</option>`).join('')}</select><input id="px" placeholder="Descrição"><input id="pd" type="date" value="${ymd()}"><button class="p" onclick="addPrazo2()">Adicionar</button></div>`}
  return `<a class="go back" href="#materias"><span class="ci">←</span>Matérias</a><div class="card hd" style="margin-top:12px"><h1 class="hl"><b><span class="dot lg" style="background:${c}"></span>${esc(m)}</b></h1></div>
  <div class="tabs">${tabs.map(t=>`<a href="javascript:setT('${t}')" class="${t===mt?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>${b}`}
const setT=t=>{mt=t;render(true)};
const addPrazo2=async()=>{if(!val('px')||!val('pd')){msg='Informe descrição e data.';return render(true)}W(sb.from('eventos').insert({materia:val('pm'),tipo:val('pt2'),descricao:val('px'),data:val('pd')}),'eventos')};

function vAjustes(){return head('Ajustes',esc(user?.email||''))+
  panel('Cor e meta semanal (horas)',`<div class="card" style="display:grid;gap:10px">${S.materias.map(x=>`<div class="sp"><span style="flex:1"><b>${esc(x.nome)}</b></span><input type="color" id="c_${esc(x.nome)}" value="${x.cor}"><input id="mh_${esc(x.nome)}" inputmode="decimal" placeholder="0" value="${x.meta_horas||''}" style="width:80px;text-align:right"></div>`).join('')}<button class="p" onclick="saveCfg()">Salvar</button></div>`)+
  panel('Nova matéria',`<div class="card sp" style="gap:8px"><input id="nn" placeholder="Nome"><input type="color" id="nc" value="#6E8FCF"><button class="p" onclick="addMat()">Criar</button></div>`)+
  panel('Conta e dados',`<div class="card"><div class="g2"><button onclick="backup()">Exportar JSON</button><button class="d" onclick="sb.auth.signOut()">Sair</button></div></div>`)}

/* ---------- render ---------- */
function render(force){const a=document.activeElement;if(!force&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  const h=location.hash.slice(1)||'hoje',on=!!user;
  ['#nv','#fab'].forEach(s=>$(s).style.display=on?'':'none');
  let v;if(!on)v=vLogin();else if(!loaded)v='<div class="sub">Carregando…</div>';
  else if(h.startsWith('m/'))v=vMateria(decodeURIComponent(h.slice(2)));else if(h==='materias')v=vMaterias();else if(h==='ajustes')v=vAjustes();else v=vHoje();
  $('#m').innerHTML=(msg&&on&&!qopen?`<div id="msg" role="alert">${esc(msg)}</div>`:'')+v;
  document.querySelectorAll('#nv a').forEach(l=>l.classList.toggle('on',l.dataset.t===(h.startsWith('m/')?'materias':h)));
  const s=ses();$('#mini').classList.toggle('on',!!s&&h!=='hoje');if(s){$('#mn').textContent='Estudando · '+s.materia;$('#mt').textContent=clock(el())}
  if(qopen&&on)drawQ()}
addEventListener('hashchange',()=>{mt='horas';msg='';render(true);scrollTo(0,0)});
render(true);
</script>
</body>
</html>
