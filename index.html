<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090F">
<title>Estudos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07090F;--sf:rgba(255,255,255,.05);--sf2:rgba(255,255,255,.08);--tx:#E4E8EE;--mu:rgba(225,229,238,.52);--ac:#2B66C9;--rd:#FF6961;--hi:inset 0 1px 0 rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 12% 0%,rgba(30,78,160,.28),transparent 70%),radial-gradient(55% 35% at 100% 20%,rgba(70,70,120,.14),transparent 70%)}
main{max-width:680px;margin:0 auto;padding:22px 16px}
h1{font-size:34px;font-weight:700;letter-spacing:-.035em;margin:0}
h2{font-size:13px;font-weight:600;color:var(--mu);margin:26px 0 10px 8px}
a{color:inherit;text-decoration:none}
.sub{color:var(--mu);font-size:14px;margin:2px 0 16px}
.card,nav,#mini,.sh{background:var(--sf);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.07);box-shadow:var(--hi),0 12px 32px rgba(0,0,0,.3)}
.card{border-radius:28px;padding:18px;display:block}
.clk{font-size:68px;font-weight:200;letter-spacing:-.04em;text-align:center;line-height:1.1}
.who{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 12px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:11px 14px;min-height:46px}
button{cursor:pointer;font-weight:600;box-shadow:var(--hi)}
button.p{background:linear-gradient(180deg,#2F6FD6,#1B4FA8);color:#fff;border-color:rgba(255,255,255,.14)}
button.d,.d{color:var(--rd)}
button.g{background:none;border:0;box-shadow:none;color:var(--mu);min-height:36px;padding:6px 10px}
input,select,textarea{width:100%}input[type=color]{padding:3px;width:54px}input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:#2B66C9}
option{background:#1C1F27}
:focus-visible{outline:2px solid #5E8FE0;outline-offset:2px}
.stat{font-size:30px;font-weight:600;letter-spacing:-.03em}.big{font-size:40px;font-weight:600;letter-spacing:-.03em}
.lbl{color:var(--mu);font-size:13.5px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:9px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px}
.it{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}.it:last-child{border:0}
.tag{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(255,255,255,.1);white-space:nowrap}
.hot{background:rgba(255,69,58,.22);color:#FF8A84}.warm{background:rgba(255,159,10,.22);color:#FFB340}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.ed{display:grid;gap:8px;padding-top:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--sf);border-radius:20px;margin:14px 0}.tabs a{flex:1;text-align:center;padding:9px 12px;border-radius:16px;font-size:14px;font-weight:600;color:var(--mu);white-space:nowrap}.tabs a.on{background:rgba(255,255,255,.1);color:#fff}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08)}.ok{text-decoration:line-through;color:var(--mu)}
.cht{display:flex;align-items:flex-end;gap:5px;height:110px}.cht div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.cht i{display:block;background:var(--ac);border-radius:5px 5px 2px 2px;margin-bottom:4px;min-height:2px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,360px);bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:32px;padding:5px;z-index:5;display:flex;gap:4px}
nav a{flex:1;text-align:center;border-radius:26px;color:var(--mu);padding:13px 0;font-weight:600}nav a.on{background:rgba(255,255,255,.1);color:#fff}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;z-index:6;background:linear-gradient(180deg,#2F6FD6,#1B4FA8);color:#fff;border-color:rgba(255,255,255,.14)}
#mini{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,360px);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;background:rgba(30,80,170,.62);border-radius:22px;padding:11px 18px;font-weight:600;display:none;justify-content:space-between}#mini.on{display:flex}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:9;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none;background:#12161D}.sh.on{display:block}.sh>div{max-width:560px;margin:0 auto;display:grid;gap:8px}
#msg{color:var(--rd);font-size:14px;margin:8px}
@media(min-width:900px){nav{left:18px;top:50%;bottom:auto;transform:translateY(-50%);width:104px;flex-direction:column}main{margin:0 auto 0 150px}body{padding-bottom:40px}#fab{bottom:24px}#mini{left:auto;right:24px;transform:none;bottom:96px}}
@media(prefers-reduced-transparency:reduce){.card,nav,#mini{backdrop-filter:none;background:#1A1D25}}
</style>
</head>
<body>
<main id="m"></main>
<a id="mini" href="#hoje"><span id="mn"></span><span id="mt"></span></a>
<button id="fab" aria-label="Adicionar" onclick="Q(true)" style="display:none">+</button>
<div class="sh" id="sh"></div>
<nav id="nv" style="display:none"><a href="#hoje" data-t="hoje">Hoje</a><a href="#materias" data-t="materias">Matérias</a><a href="#ajustes" data-t="ajustes">Ajustes</a></nav>
<script>
const sb=supabase.createClient('https://imisnquvmrmxufhvhfrd.supabase.co','sb_publishable_fiqvZpb6S2yV1G5KpnxxrQ_P4ieZDyO');
const T=['materias','estudos','eventos','notas','regras','listas','plano','sessao'];
const S=Object.fromEntries(T.map(t=>[t,[]]));
const $=s=>document.querySelector(s);
let user=null,msg='',mt='horas',qt='estudo',sent=false,qopen=false,loaded=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>d.toLocaleDateString('sv'),dm=d=>d.slice(8)+'/'+d.slice(5,7);
const fh=h=>{let t=Math.round(h*60);return Math.floor(t/60)+'h'+String(t%60).padStart(2,'0')};
const left=d=>Math.round((new Date(d+'T00:00')-new Date(ymd()+'T00:00'))/864e5);
const ws=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const mat=n=>S.materias.find(x=>x.nome===n),cor=n=>mat(n)?.cor||'#8A9BB0';
const sum=f=>S.estudos.filter(f).reduce((a,r)=>a+Number(r.horas),0);
const hs=m=>sum(r=>r.materia===m&&r.data>=ws());
const opts=(sel)=>S.materias.map(x=>`<option${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`).join('');
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p))}%;background:${c}"></i></div>`;

/* ---------- dados ---------- */
async function load(t){const{data,error}=await sb.from(t).select('*');if(error)msg=error.message;else S[t]=data}
async function W(p,...ts){const r=await p;msg=r.error?r.error.message:'';await Promise.all(ts.map(load));render(true);return !r.error}
async function boot(){await Promise.all(T.map(load));loaded=true;render(true);
  sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},p=>load(p.table).then(()=>render())).subscribe()}
sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null;if(u&&!user){user=u;boot()}else if(!u){user=null;loaded=false;render(true)}});

/* ---------- cronômetro ---------- */
const ses=()=>S.sessao[0]||null;
const el=()=>{const s=ses();return s?Number(s.acumulado_ms)+(s.rodando?Date.now()-new Date(s.inicio):0):0};
const clock=ms=>{const t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(n=>String(n).padStart(2,'0')).join(':')};
const iniciar=()=>{const m=$('#cm').value;if(m)W(sb.from('sessao').upsert({id:1,materia:m,inicio:new Date().toISOString(),acumulado_ms:0,rodando:true}),'sessao')};
const pausar=()=>{const s=ses();W(s.rodando?sb.from('sessao').update({acumulado_ms:Math.round(el()),rodando:false}).eq('id',1):sb.from('sessao').update({inicio:new Date().toISOString(),rodando:true}).eq('id',1),'sessao')};
async function encerrar(){const s=ses(),h=el()/36e5;if(h>=1/120)await sb.from('estudos').insert({materia:s.materia,horas:h,data:ymd()});W(sb.from('sessao').delete().eq('id',1),'sessao','estudos')}
const descartar=()=>{if(confirm('Descartar esta sessão sem salvar?'))W(sb.from('sessao').delete().eq('id',1),'sessao')};
setInterval(()=>{if(!ses())return;const c=clock(el());if($('#clk'))$('#clk').textContent=c;$('#mt').textContent=c},1000);

/* ---------- notas ---------- */
const leaves=c=>c.subcomponentes?c.subcomponentes.flatMap(leaves):[c.nome];
const avg=l=>l.reduce((a,b)=>a+b)/l.length;
function prov(c,n){if(c.subcomponentes){let w=0,p=0;for(const x of c.subcomponentes){const v=prov(x,n);if(v!=null){w+=x.peso;p+=v*x.peso}}return w?p/w:null}const l=n[c.nome];return l&&l.length?avg(l):null}
function parc(c,n,e){if(c.subcomponentes){const t=c.subcomponentes.reduce((a,x)=>a+x.peso,0);let p=0,o=0;for(const x of c.subcomponentes){const[a,b]=parc(x,n,e*x.peso/t);p+=a;o+=b}return[p,o]}const l=n[c.nome];return l&&l.length?[avg(l)/10*e,0]:[0,e]}
function info(m){const cfg=S.regras.find(r=>r.materia===m)?.config;if(!cfg)return null;const n={};S.notas.filter(r=>r.materia===m).forEach(r=>(n[r.componente]??=[]).push(Number(r.valor)));
  const root={subcomponentes:cfg.componentes};let md=prov(root,n);if(md!=null&&cfg.arredondar_meio_ponto)md=Math.floor(md*2+.5)/2;
  const[p,o]=parc(root,n,10),meta=cfg.arredondar_meio_ponto?5.75:6;return{md,cfg,open:o>1e-9,need:o>1e-9?(meta-p)*10/o:null}}
const comps=m=>{const c=S.regras.find(r=>r.materia===m)?.config;return c?leaves({subcomponentes:c.componentes}):[]};

/* ---------- foco recomendado ---------- */
function foco(){const hoje=ymd();return S.materias.map(x=>{const m=x.nome,pv=S.eventos.filter(e=>e.materia===m&&e.tipo==='Prova'&&e.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data))[0],
  d=pv?left(pv.data):null,u=d==null?0:1/(1+d/7),f=info(m),r=f&&f.md!=null?Math.max(0,(6-f.md)/6):0,h=hs(m),df=x.meta_horas?Math.max(0,1-h/x.meta_horas):.3;
  return{m,d,md:f?.md,h,score:.5*u+.3*r+.2*df}}).sort((a,b)=>b.score-a.score)}

/* ---------- escrita ---------- */
const val=id=>$('#'+id)?.value?.trim()??'';
async function addEstudo(p='q'){const m=val(p+'m'),h=+val(p+'h')||0,mi=+val(p+'i')||0;if(!m||h+mi<=0){msg='Informe matéria e tempo.';return render(true)}
  if(await W(sb.from('estudos').insert({materia:m,horas:h+mi/60,data:val(p+'d')||ymd()}),'estudos'))Q(false)}
async function addNota(p='q'){const v=parseFloat(val(p+'v').replace(',','.'));if(isNaN(v)||v<0||v>10){msg='Nota entre 0 e 10.';return render(true)}
  if(await W(sb.from('notas').insert({materia:val(p+'m'),componente:val(p+'c'),valor:v,data:val(p+'d')||ymd()}),'notas'))Q(false)}
async function addPrazo(p='q'){if(!val(p+'x')||!val(p+'d')){msg='Informe descrição e data.';return render(true)}
  if(await W(sb.from('eventos').insert({materia:val(p+'m'),tipo:val(p+'t'),descricao:val(p+'x'),data:val(p+'d')}),'eventos'))Q(false)}
const del=(t,id)=>W(sb.from(t).delete().eq('id',id),t);
const movPrazo=id=>{const v=$('#d'+id).value;if(v)W(sb.from('eventos').update({data:v}).eq('id',id),'eventos')};
const stepL=(id,d)=>{const r=S.listas.find(x=>x.id===id);W(sb.from('listas').update({feitas:Math.max(0,Math.min(r.total,r.feitas+d))}).eq('id',id),'listas')};
const addL=m=>{const n=val('ln'),t=+val('lt');if(!n||t<1){msg='Nome e nº de questões.';return render(true)}W(sb.from('listas').insert({materia:m,nome:n,total:t}),'listas')};
const tgl=(id,ok)=>W(sb.from('plano').update({ok}).eq('id',id),'plano');
const addP=m=>{const l=val('pt').split('\n').map(x=>x.trim()).filter(Boolean);if(!l.length)return;const o=S.plano.filter(x=>x.materia===m).length;W(sb.from('plano').insert(l.map((t,i)=>({materia:m,topico:t,ordem:o+i}))),'plano')};
async function saveCfg(){for(const x of S.materias){const c=$('#c_'+x.nome)?.value,v=parseFloat(($('#mh_'+x.nome)?.value||'').replace(',','.'));
  await sb.from('materias').update({cor:c,meta_horas:v>0?v:null}).eq('nome',x.nome)}W(Promise.resolve({}),'materias')}
const addMat=()=>{const n=val('nn');if(n)W(sb.from('materias').insert({nome:n,cor:$('#nc').value}),'materias')};
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='estudos-backup-'+ymd()+'.json';a.click()}

/* ---------- adicionar rápido ---------- */
function Q(open){qopen=open;$('#sh').classList.toggle('on',open);if(!open){$('#sh').innerHTML='';return}drawQ()}
function setQ(t){qt=t;drawQ()}
function fMat(p,m){return `<select id="${p}m"${qt==='nota'?` onchange="$('#${p}c').innerHTML=comps(this.value).map(c=>'<option>'+c+'</option>').join('')"`:''}>${opts(m)}</select>`}
function drawQ(){const m0=S.materias[0]?.nome;
  const f=qt==='estudo'?`${fMat('q')}<div class="g2"><input id="qh" type="number" min="0" placeholder="Horas"><input id="qi" type="number" min="0" max="59" step="5" placeholder="Minutos"></div><input id="qd" type="date" value="${ymd()}"><button class="p" onclick="addEstudo()">Registrar</button>`
   :qt==='nota'?`${fMat('q')}<select id="qc">${comps(m0).map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="g2"><input id="qv" inputmode="decimal" placeholder="Nota (0 a 10)"><input id="qd" type="date" value="${ymd()}"></div><button class="p" onclick="addNota()">Lançar</button>`
   :`${fMat('q')}<select id="qt">${['Prova','Entrega','Apresentação','Outro'].map(t=>`<option>${t}</option>`).join('')}</select><input id="qx" placeholder="Descrição"><input id="qd" type="date" value="${ymd()}"><button class="p" onclick="addPrazo()">Adicionar</button>`;
  $('#sh').innerHTML=`<div><div class="tabs">${['estudo','nota','prazo'].map(t=>`<a href="javascript:setQ('${t}')" class="${t===qt?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>${msg?`<div id="msg">${esc(msg)}</div>`:''}${f}<button class="g" onclick="Q(false)">Fechar</button></div>`}

/* ---------- componentes de tela ---------- */
function evRow(r){const n=left(r.data),t=n===0?'Hoje':n===1?'Amanhã':n<0?dm(r.data):n+' dias',c=n<=1?'hot':n<=7?'warm':'';
  return `<details class="it"><summary class="sp"><span><span class="dot" style="background:${cor(r.materia)}"></span><b>${esc(r.materia)}</b><span class="lbl"> · ${esc(r.tipo)} · ${esc(r.descricao)} · ${dm(r.data)}</span></span><span class="tag ${c}">${t}</span></summary>
  <div class="ed"><input type="date" id="d${r.id}" value="${r.data}"><div class="g2"><button class="p" onclick="movPrazo('${r.id}')">Remarcar</button><button class="d" onclick="del('eventos','${r.id}')">Excluir</button></div></div></details>`}
const futuros=m=>S.eventos.filter(e=>e.data>=ymd()&&(!m||e.materia===m)).sort((a,b)=>a.data.localeCompare(b.data));
function chart(f){const ds=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(ymd(d))}
  const v=ds.map(d=>sum(r=>r.data===d&&f(r))),mx=Math.max(...v,.1);
  return `<div class="cht">${ds.map((d,i)=>`<div><i style="height:${v[i]/mx*84}px;${v[i]?'':'opacity:.25'}"></i>${+d.slice(8)}</div>`).join('')}</div><div class="lbl" style="margin-top:6px">Últimos 14 dias · ${fh(v.reduce((a,b)=>a+b,0))}</div>`}

/* ---------- telas ---------- */
function vLogin(){return `<h1>Estudos</h1><div class="sub">Entre com seu e-mail para receber o link de acesso</div><div class="card" style="display:grid;gap:8px">
  ${sent?'<div>Link enviado. Abra o e-mail neste aparelho e toque no link.</div>':`<input id="em" type="email" placeholder="seu@email.com" autocomplete="email"><button class="p" onclick="entrar()">Enviar link</button>`}${msg?`<div id="msg">${esc(msg)}</div>`:''}</div>`}
async function entrar(){const email=val('em');if(!email)return;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)msg=error.message;else{msg='';sent=true}render(true)}

function vHoje(){const s=ses(),h0=ymd(),ht=sum(r=>r.data===h0),hw=sum(r=>r.data>=ws()),metaT=S.materias.reduce((a,x)=>a+Number(x.meta_horas||0),0),fc=foco().filter(x=>x.score>.05).slice(0,3),mx=fc[0]?.score||1;
  const timer=s?`<div class="who">Estudando <b style="color:var(--tx)">${esc(s.materia)}</b>${s.rodando?'':' · pausado'}</div><div class="clk" id="clk">${clock(el())}</div>
   <div class="g2" style="margin-top:12px"><button onclick="pausar()">${s.rodando?'Pausar':'Retomar'}</button><button class="p" onclick="encerrar()">Encerrar e salvar</button></div><button class="g d" style="width:100%;margin-top:6px" onclick="descartar()">Descartar sessão</button>`
   :`<div class="clk" style="color:var(--mu)">00:00:00</div><div style="display:grid;gap:8px;margin-top:10px"><select id="cm">${opts()}</select><button class="p" onclick="iniciar()">Iniciar</button></div>`;
  return `<h1>Hoje</h1><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="card">${timer}</div>
  <div class="g2" style="margin-top:10px"><div class="card"><div class="stat">${fh(ht)}</div><div class="lbl">hoje</div></div><div class="card"><div class="stat">${fh(hw)}</div><div class="lbl">na semana${metaT?' · meta '+fh(metaT):''}</div>${metaT?bar(hw/metaT*100,'var(--ac)'):''}</div></div>
  <h2>Foco recomendado</h2><div class="card">${fc.length?fc.map(x=>`<a class="it" style="display:block" href="#m/${encodeURIComponent(x.m)}"><div class="sp"><span><span class="dot" style="background:${cor(x.m)}"></span><b>${esc(x.m)}</b></span><span class="lbl">${[x.d!=null?(x.d===0?'prova hoje':'prova em '+x.d+' d'):'',x.md!=null?'média '+x.md.toFixed(2):'',fh(x.h)+' na semana'].filter(Boolean).join(' · ')}</span></div>${bar(x.score/mx*100,cor(x.m))}</a>`).join(''):'<div class="lbl">Nada urgente agora.</div>'}</div>
  <h2>Próximos prazos</h2><div class="card">${futuros().slice(0,3).map(evRow).join('')||'<div class="lbl">Nenhum prazo futuro.</div>'}</div>`}

function vMaterias(){return `<h1>Matérias</h1><div class="sub">Toque para ver tudo de cada uma</div><div class="gr">${S.materias.sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(x=>{const f=info(x.nome),p=futuros(x.nome)[0],h=hs(x.nome);
  return `<a class="card" href="#m/${encodeURIComponent(x.nome)}"><div style="font-weight:600"><span class="dot" style="background:${x.cor}"></span>${esc(x.nome)}</div>
  <div class="stat" style="margin-top:10px">${f&&f.md!=null?f.md.toFixed(2):'—'}</div><div class="lbl">média provisória</div>${bar(x.meta_horas?h/x.meta_horas*100:0,x.cor)}
  <div class="lbl" style="margin-top:6px">${fh(h)} na semana${p?` · ${esc(p.tipo)} em ${left(p.data)}d`:''}</div></a>`}).join('')}</div>`}

function vMateria(m){const x=mat(m);if(!x)return '<div class="sub">Matéria não encontrada.</div><a href="#materias">← Matérias</a>';
  const tabs=['horas','notas','listas','plano','prazos'],c=x.cor;let b='';
  if(mt==='horas'){const rs=S.estudos.filter(r=>r.materia===m).sort((a,z)=>z.data.localeCompare(a.data)).slice(0,25),tot=sum(r=>r.materia===m);
    b=`<div class="g2"><div class="card"><div class="stat">${fh(hs(m))}</div><div class="lbl">na semana${x.meta_horas?' / '+fh(x.meta_horas):''}</div></div><div class="card"><div class="stat">${fh(tot)}</div><div class="lbl">total</div></div></div>
    <h2>Evolução</h2><div class="card">${chart(r=>r.materia===m)}</div><h2>Registros</h2><div class="card">${rs.map(r=>`<div class="it sp"><span>${dm(r.data)}</span><span><b>${fh(r.horas)}</b> <button class="g d" onclick="del('estudos','${r.id}')">Excluir</button></span></div>`).join('')||'<div class="lbl">Nenhum registro.</div>'}</div>`}
  if(mt==='notas'){const f=info(m),rs=S.notas.filter(r=>r.materia===m).sort((a,z)=>z.data.localeCompare(a.data));
    const st=!f||f.md==null?'Sem notas':f.md>=6?'Aprovado':f.md>=3?'Recuperação':'Em risco',nd=!f?'Sem regras cadastradas':!f.open?'Todas as notas lançadas':f.need<=0?'Aprovação já garantida':f.need>10?'Aprovação direta inviável':`Precisa de ${f.need.toFixed(2)} no restante`;
    b=`<div class="card"><div class="sp"><span class="big">${f&&f.md!=null?f.md.toFixed(2):'—'}</span><span class="tag">${st}</span></div><div class="lbl">${nd}</div>${f?.cfg?.descricao?`<div class="lbl" style="margin-top:8px">${esc(f.cfg.descricao)}</div>`:''}</div>
    <h2>Lançamentos</h2><div class="card">${rs.map(r=>`<div class="it sp"><span>${esc(r.componente)} <span class="lbl">· ${dm(r.data)}</span></span><span><b>${Number(r.valor).toFixed(1)}</b> <button class="g d" onclick="del('notas','${r.id}')">Excluir</button></span></div>`).join('')||'<div class="lbl">Nenhuma nota.</div>'}</div>
    <h2>Lançar nota</h2><div class="card" style="display:grid;gap:8px"><input type="hidden" id="nm" value="${esc(m)}"><select id="nc">${comps(m).map(k=>`<option>${esc(k)}</option>`).join('')}</select><div class="g2"><input id="nv" inputmode="decimal" placeholder="Nota (0 a 10)"><input id="nd" type="date" value="${ymd()}"></div><button class="p" onclick="addNota('n')">Lançar</button></div>`}
  if(mt==='listas'){const ls=S.listas.filter(r=>r.materia===m);
    b=`<div class="card">${ls.map(r=>`<div class="it"><div class="sp"><b>${esc(r.nome)}</b><span class="lbl">${r.feitas}/${r.total}</span></div>${bar(r.feitas/r.total*100,c)}<div class="g2" style="margin-top:10px"><button onclick="stepL('${r.id}',-1)">−</button><button onclick="stepL('${r.id}',1)">+</button></div><button class="g d" onclick="del('listas','${r.id}')">Excluir lista</button></div>`).join('')||'<div class="lbl">Nenhuma lista.</div>'}
    <div class="g2" style="margin-top:12px"><input id="ln" placeholder="Nome (Lista 3)"><input id="lt" type="number" min="1" placeholder="Questões"></div><button class="p" style="width:100%;margin-top:8px" onclick="addL('${esc(m)}')">Adicionar lista</button></div>`}
  if(mt==='plano'){const ps=S.plano.filter(r=>r.materia===m).sort((a,z)=>a.ordem-z.ordem),f=ps.filter(r=>r.ok).length;
    b=`<div class="card">${ps.length?`<div class="sp"><b>Conteúdo estudado</b><span class="lbl">${f}/${ps.length}</span></div>${bar(f/ps.length*100,c)}`:''}${ps.map(r=>`<label class="chk"><input type="checkbox" ${r.ok?'checked':''} onchange="tgl('${r.id}',this.checked)"><span style="flex:1" class="${r.ok?'ok':''}">${esc(r.topico)}</span><button class="g d" onclick="event.preventDefault();del('plano','${r.id}')" aria-label="Remover">✕</button></label>`).join('')||'<div class="lbl" style="margin-top:6px">Cole os tópicos abaixo, um por linha.</div>'}
    <textarea id="pt" rows="4" placeholder="1. Carga e matéria&#10;2. Campo elétrico" style="margin-top:12px"></textarea><button class="p" style="width:100%;margin-top:8px" onclick="addP('${esc(m)}')">Adicionar tópicos</button></div>`}
  if(mt==='prazos'){b=`<div class="card">${S.eventos.filter(e=>e.materia===m).sort((a,z)=>a.data.localeCompare(z.data)).map(evRow).join('')||'<div class="lbl">Nenhum prazo.</div>'}</div>
    <h2>Novo prazo</h2><div class="card" style="display:grid;gap:8px"><input type="hidden" id="pm" value="${esc(m)}"><select id="pt2">${['Prova','Entrega','Apresentação','Outro'].map(t=>`<option>${t}</option>`).join('')}</select><input id="px" placeholder="Descrição"><input id="pd" type="date" value="${ymd()}"><button class="p" onclick="addPrazo2()">Adicionar</button></div>`}
  return `<a class="lbl" href="#materias">← Matérias</a><h1 style="margin-top:6px"><span class="dot" style="background:${c};width:14px;height:14px"></span>${esc(m)}</h1>
  <div class="tabs">${tabs.map(t=>`<a href="javascript:setT('${t}')" class="${t===mt?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>${b}`}
const setT=t=>{mt=t;render(true)};
const addPrazo2=async()=>{if(!val('px')||!val('pd')){msg='Informe descrição e data.';return render(true)}W(sb.from('eventos').insert({materia:val('pm'),tipo:val('pt2'),descricao:val('px'),data:val('pd')}),'eventos')};

function vAjustes(){return `<h1>Ajustes</h1><div class="sub">${esc(user?.email||'')}</div>
  <h2>Cor e meta semanal (horas)</h2><div class="card" style="display:grid;gap:10px">${S.materias.map(x=>`<div class="sp"><span style="flex:1"><b>${esc(x.nome)}</b></span><input type="color" id="c_${esc(x.nome)}" value="${x.cor}"><input id="mh_${esc(x.nome)}" inputmode="decimal" placeholder="0" value="${x.meta_horas||''}" style="width:80px;text-align:right"></div>`).join('')}<button class="p" onclick="saveCfg()">Salvar</button></div>
  <h2>Nova matéria</h2><div class="card sp" style="gap:8px"><input id="nn" placeholder="Nome"><input type="color" id="nc" value="#6E8FCF"><button class="p" onclick="addMat()">Criar</button></div>
  <h2>Conta e dados</h2><div class="g2"><button onclick="backup()">Exportar JSON</button><button class="d" onclick="sb.auth.signOut()">Sair</button></div>`}

/* ---------- render ---------- */
function render(force){const a=document.activeElement;if(!force&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  const h=location.hash.slice(1)||'hoje',on=!!user;
  ['#nv','#fab'].forEach(s=>$(s).style.display=on?'':'none');
  let v;if(!on)v=vLogin();else if(!loaded)v='<div class="sub">Carregando…</div>';
  else if(h.startsWith('m/'))v=vMateria(decodeURIComponent(h.slice(2)));else if(h==='materias')v=vMaterias();else if(h==='ajustes')v=vAjustes();else v=vHoje();
  $('#m').innerHTML=(msg&&on&&!qopen?`<div id="msg" role="alert">${esc(msg)}</div>`:'')+v;
  document.querySelectorAll('#nv a').forEach(l=>l.classList.toggle('on',l.dataset.t===(h.startsWith('m/')?'materias':h)));
  const s=ses();$('#mini').classList.toggle('on',!!s&&h!=='hoje');if(s){$('#mn').textContent='Estudando · '+s.materia;$('#mt').textContent=clock(el())}
  if(qopen&&on)drawQ()}
addEventListener('hashchange',()=>{mt='horas';msg='';render(true);scrollTo(0,0)});
render(true);
</script>
</body>
</html>
